<!---MATERIAL BUTTON -->
<button type="button" style="margin-top:25px" class="btn" id="btn"
        data-original-title="" data-toggle="tooltip" data-placement="bottom">
    <i class=""></i>
</button>

<!---MATERIAL ICON BUTTON -->
<button type="button" data-original-title="" style="margin-top:25px" data-toggle="tooltip" data-placement="bottom"
        class="btn btn-icon btn-icon-md btn-sm" id="btn">
    <i class=""></i>
</button>

<!---MATERIAL ICON -->
<i id="ico" data-original-title="" style="margin-top:25px" class="" data-toggle="tooltip" data-placement="bottom"></i>
<!---MATERIAL INPUT OUTLINE-->
<div class="form-outline">
    <input type="text" class="form-control input-form fs-margin-t-25"
           name="" id="" value="" />
    <label class="form-label" for=""></label>
</div>
<!---MATERIAL TEXTAREA OUTLINE-->
<div class="form-outline">
    <textarea type="text" class="form-control input-form fs-margin-t-25"
              name="" id=""></textarea>
    <label class="form-label" for=""></label>
</div>
<!---MATERIAL BOOTSTRAP SELECT -->

<select title="" class="form-control fs-selectpicker input-form"
        data-live-search="true" id="" value="">
    <option value="" selected>SELECCTIONE</option>
</select>

<!---MATERIAL BOOTSTRAP MULTI SELECT -->
<label class="control-label"></label>
<select title="" multiple data-selected-text-format="count > 3"
        data-actions-box="true" data-select-all-text="Todos"
        data-live-search="true" 
        data-deselect-all-text="Ninguno"
        class="form-control fs-selectpicker input-form"
        id="" value="">
    <option value="" disabled>SELECCIONE</option>
</select>

<!---MATERIAL TOGGLE -->
<div class="form-check form-switch">
    <input class="form-check-input fs-toggle input-form" type="checkbox"
           id="" name="" />
    <label class="form-check-label" for=""></label>
</div>

<style>
    /* Required Values in Material*/
    .input-form.required ~ .form-label:after {
        content: "*" !important;
        color: red !important;
    }
</style>

<!-- AUTO COMPLETE-->
<div class="md-form">
    <input type="search" id="form-autocomplete-4" class="form-control mdb-autocomplete">
    <button class="mdb-autocomplete-clear">
        <svg fill="#000000" height="24" viewBox="0 0 24 24" width="24" xmlns="https://www.w3.org/2000/svg">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
            <path d="M0 0h24v24H0z" fill="none" />
        </svg>
    </button>
    <label for="form-autocomplete-4" class="active"></label>
</div>
<!-- DateTime-->
<div class="form-outline ">
    <input type="text" data-open="datetime-picker-" class="form-control date-time picker-opener fs-pickadatetime fs-margin-t-25" name="" id="" />
    <input placeholder="Fecha selecionada" type="text" id="datetime-picker-" class="time-date-ghost">
    <input placeholder="Hora seleccionada" data-open="datetime-picker-" type="text" class="timepicker time-date-ghost">
    <label class="form-label" for=""></label>
</div>
<!-- Date-->
<div class="form-outline ">
    <input type="text" class="form-control fs-pickadate fs-margin-t-25"
           name="" id="" />
    <label class="form-label" for=""></label>
</div>
<!-- Time -->
<div class="form-outline ">
    <input type="text" class="form-control fs-pickatime fs-margin-t-25"
           name="" id="" />
    <label class="form-label" for=""></label>
</div>
<!-- Auto Increment -->
<div class="def-number-input number-input safari_only">
    <button onclick="this.parentNode.querySelector('input[type=number]').stepDown()" class="minus"></button>
    <input class="form-control" type="number"
           min="" step="" name="" id="" value="" />
    <button onclick="this.parentNode.querySelector('input[type=number]').stepUp()" class="plus"></button>
</div>
<!--SCHEDULES TEMPLATE-->
<div class="d-flex w-100 justify-content-around align-items-center schedule" id="schedule-${dayNo}" data-id="${id}" data-day="${dayNo}">
    <h5 style="min-width:5em">${dayOfWeek}</h5>
    <div class="form-check form-switch ">
        <input class="form-check-input fs-toggle input-form" type="checkbox"
               id="schedule-${dayNo}-isopen" name="schedule-${dayNo}-isopen" />
        <label class="form-check-label" for="schedule-${dayNo}-isopen">Abierto</label>
    </div>
    <div class="form-outline ${timepickerVisible ? 'fs-fadeIn' : 'fs-fadeOut'}">
        <input type="text" class="form-control fs-pickatime" value="${(values && values.openHour) ?? ''}"
               name="schedule-${dayNo}-openHour" id="schedule-${dayNo}-openHour" />
        <label class="form-label" for="schedule-${dayNo}-openHour">Apertura</label>
    </div>
    <div class="form-outline ${timepickerVisible ? 'fs-fadeIn' : 'fs-fadeOut'}">
        <input type="text" class="form-control fs-pickatime" value="${(values && values.closeHour) ?? ''}"
               name="schedule-${dayNo}-closeHour" id="schedule-${dayNo}-closeHour" />
        <label class="form-label" for="schedule-${dayNo}-closeHour">Cierre</label>
    </div>
</div>
<!--CHIPS-->
<div class="chip">
    <span></span>
    <i class="edit fas fa-pen"></i>
    <i class="close fas fa-times"></i>
</div>
